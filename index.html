<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datetime</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="clock.js"></script>
    <div id="content">
        <div id="date">YYYY-MM-DD</div>
        <div id="time">hh:mm:ss</div>
        <div id="search">
            <select id="search-select" class="no-default">
                <option value="ddg">DDG</option>
                <option value="google">Google</option>
            </select>
            <input id="search-input" class="no-default" type="text" placeholder="Search...">
            <button id="search-button" class="no-default" type="button"><img id="search-img" src="images/mag.png" alt="search icon"></button>
        </div>
    </div>
</body>

</html>
