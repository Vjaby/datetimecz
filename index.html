<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datetime</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="clock.js"></script>
    <script src="search.js"></script>
    <div id="content">

        <div>
            <button id="date-button" class="no-default copy-button" title="Zkopírovat datum">
                <div id="date">YYYY-MM-DD</div>
            </button>
        </div>

        <div>
            <button id="time-button" class="no-default copy-button" title="Zkopírovat čas">
                <div id="time">hh:mm:ss</div>
            </button>
        </div>

        <search id="search">
            <select id="search-select" class="no-default">
                <option value="ddg">DDG</option>
                <option value="google">Google</option>
                <option value="seznam">Seznam</option>
            </select>
            <input id="search-input" class="no-default" type="text" placeholder="Vyhledat..." autofocus>
            <button id="search-button" class="no-default" type="button">
                <img id="search-img" src="images/mag.png" alt="search icon">
            </button>
        </search>

    </div>


    <button id="show-settings-button" class="settings-button no-default">Nastavení</button>

    <div id="settings">
        <button id="hide-settings-button" class="settings-button no-default">Zavřít</button>
        <div>
            <div class="format-form">
                Nový formát datumu: <br>
                <input id="date-format-input" class="no-default" type="text" placeholder="{0}-{1}-{2}">
                <button id="date-format-button" class="no-default">Použít</button>
            </div> <br>
            <div class="format-form">
                Nový formát času: <br>
                <input id="time-format-input" class="no-default" type="text" placeholder="{0}:{1}:{2}">
                <button id="time-format-button" class="no-default">Použít</button>
            </div>
        </div>

        <p class="cookie-text">
            Nastavení se ukládá do cookies.
        </p>
    </div>

</body>

</html>
